<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заметки</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>📝 Общие заметки</h1>
    <p class="sub">Пиши что хочешь — все увидят.</p>
  </header>

  <main>
    <form id="note-form">
      <input id="author" type="text" placeholder="Твоё имя (необязательно)" maxlength="40" />
      <textarea id="content" placeholder="Текст заметки..." maxlength="500" required></textarea>
      <div class="row">
        <span id="counter">0 / 500</span>
        <button type="submit" id="submit-btn">Отправить</button>
      </div>
    </form>

    <div id="status"></div>
    <div id="notes"></div>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
